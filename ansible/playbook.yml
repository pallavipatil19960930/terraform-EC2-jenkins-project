---
- name: Configure Docker and deploy application
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait for EC2 SSH connection
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/devops-web
        state: directory
        mode: "0755"

    - name: Copy Docker application files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/"
        dest: /opt/devops-web/
        mode: "0644"

    - name: Build Docker image
      ansible.builtin.command:
        cmd: "docker build -t devops-web:{{ environment }} ."
        chdir: /opt/devops-web

    - name: Remove existing application container
      ansible.builtin.command:
        cmd: docker rm -f devops-web
      register: remove_container
      failed_when: false
      changed_when: remove_container.rc == 0

    - name: Start Docker container
      ansible.builtin.command:
        cmd: >-
          docker run -d
          --name devops-web
          --restart unless-stopped
          -p 80:80
          devops-web:{{ environment }}